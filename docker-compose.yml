services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infoshield-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - HOST=0.0.0.0
      - PORT=8000
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - SUPABASE_URL=${SUPABASE_URL:-https://hnjyzohgjleezdkhtpld.supabase.co}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-sb_secret_1elR7AnOwm7WafBmIILMTw_3dQIvVll}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-45670357-e9f4-4bb1-9707-ef6bd2b2ab36}
      - DEMO_USER_ID=00000000-0000-0000-0000-000000000001
      - AUTH_ENABLED=true
    volumes:
      - ./backend/uploads:/tmp/infoshield/uploads
      - ./backend/outputs:/tmp/infoshield/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: nginx:alpine
    container_name: infoshield-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
